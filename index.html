<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RelayBox FM</title>
    
    <link id="manifest-link" rel="manifest" href="">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#ec4899', // Pink
                        secondary: '#8b5cf6', // Purple
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Outfit', sans-serif;
            overflow: hidden; /* Prevent body scroll, handle scroll in tabs */
        }

        /* Animated Gradient Mesh Background */
        .bg-mesh {
            background: linear-gradient(-45deg, #0f172a, #312e81, #701a75, #1e1b4b, #111827);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Glassmorphism */
        .glass-header {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Vinyl Record Spin */
        .vinyl {
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .vinyl::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15%;
            height: 15%;
            background: #111827;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 10;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .is-playing .vinyl {
            animation: spin 5s linear infinite;
        }

        .is-paused .vinyl {
            animation: spin 5s linear infinite;
            animation-play-state: paused;
        }

        /* Smooth fade in */
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Tab Navigation Active State */
        .tab-btn { transition: all 0.3s ease; }
        .tab-active {
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(236,72,153,0.8));
            transform: scale(1.1);
        }
        .tab-inactive { color: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="text-white">

    <div class="bg-mesh"></div>

    <!-- Main App Container -->
    <div class="h-screen w-full max-w-md mx-auto flex flex-col relative z-10 bg-black/20 backdrop-blur-sm shadow-2xl">
        
        <!-- Header / Navigation -->
        <header class="glass-header flex justify-between items-center p-5 shrink-0 z-20">
            <h1 class="font-extrabold text-2xl tracking-tight">RelayBox<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">FM</span></h1>
            <nav class="flex gap-6 text-2xl items-center">
                <button onclick="app.switchTab('player')" id="nav-player" class="tab-btn tab-active"><i class="fa-solid fa-music"></i></button>
                <button onclick="app.switchTab('favorites')" id="nav-favorites" class="tab-btn tab-inactive"><i class="fa-solid fa-star"></i></button>
                <button onclick="app.switchTab('explore')" id="nav-explore" class="tab-btn tab-inactive"><i class="fa-solid fa-magnifying-glass"></i></button>
            </nav>
        </header>

        <!-- Dynamic Background Blur for Player -->
        <div id="player-bg-blur" class="absolute inset-0 bg-cover bg-center opacity-10 filter blur-3xl mix-blend-overlay transition-all duration-1000 pointer-events-none z-0"></div>

        <!-- Main Content Area (Scrollable) -->
        <main class="flex-1 relative overflow-hidden z-10">
            
            <!-- VIEW: PLAYER -->
            <div id="view-player" class="absolute inset-0 flex flex-col items-center justify-center p-6 fade-in overflow-y-auto no-scrollbar">
                
                <div class="relative w-56 h-56 sm:w-64 sm:h-64 mb-8" id="player-stage">
                    <img id="player-thumb" src="https://placehold.co/400x400/1e1b4b/ffffff?text=FM" alt="Radio" class="w-full h-full object-cover vinyl shadow-2xl">
                    
                    <!-- 30s Buffering Overlay -->
                    <div id="buffer-overlay" class="absolute inset-0 bg-black/80 rounded-full flex flex-col items-center justify-center hidden z-20 backdrop-blur-sm">
                        <span id="buffer-count" class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary mb-1">30</span>
                        <span class="text-[10px] text-white/70 uppercase tracking-[0.2em]">Buffering</span>
                        <!-- Spinner Ring -->
                        <div class="absolute inset-2 border-4 border-transparent border-t-primary border-b-secondary rounded-full animate-spin opacity-50 pointer-events-none"></div>
                    </div>
                </div>

                <div class="text-center w-full mb-10 px-4">
                    <h2 id="player-name" class="text-3xl font-bold truncate mb-2 drop-shadow-md">Select a Station</h2>
                    <!-- Emulated Now Playing / Genre Info -->
                    <p id="player-now-playing" class="text-sm font-medium text-pink-400 tracking-wide uppercase truncate w-full h-5">Explore to start listening</p>
                </div>

                <div class="flex items-center justify-center gap-10 w-full">
                    <!-- Favorite Button -->
                    <button onclick="app.toggleFavorite()" id="btn-fav" class="text-3xl text-gray-400 hover:scale-110 transition-transform">
                        <i class="fa-regular fa-star" id="icon-fav"></i>
                    </button>

                    <!-- Play/Pause Button -->
                    <button onclick="app.togglePlay()" id="btn-play" class="w-24 h-24 rounded-full bg-gradient-to-br from-primary to-secondary text-white flex items-center justify-center shadow-[0_0_30px_rgba(236,72,153,0.4)] active:scale-95 transition-transform border-2 border-white/20">
                        <i class="fa-solid fa-play text-4xl ml-2 drop-shadow-md" id="icon-play"></i>
                    </button>

                    <!-- Random Button -->
                    <button onclick="app.playRandom()" class="text-3xl text-gray-400 hover:text-white hover:scale-110 transition-transform">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                </div>
            </div>

            <!-- VIEW: FAVORITES -->
            <div id="view-favorites" class="absolute inset-0 hidden flex-col fade-in bg-black/40">
                <div class="p-5 border-b border-white/10 shrink-0 bg-black/20">
                    <h2 class="text-xl font-bold"><i class="fa-solid fa-star text-yellow-400 mr-2"></i> Your Favorites</h2>
                </div>
                <div id="favorites-list" class="flex-1 overflow-y-auto no-scrollbar p-2">
                    <!-- Fav list rendered here -->
                </div>
            </div>

            <!-- VIEW: EXPLORE -->
            <div id="view-explore" class="absolute inset-0 hidden flex-col fade-in bg-black/40">
                <div class="p-4 border-b border-white/10 shrink-0 bg-black/20">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-white/50"></i>
                        <input type="text" id="search-input" onkeyup="app.filterStations()" placeholder="Search Malayalam radios..." class="w-full bg-white/10 border border-white/20 rounded-full py-3 pl-12 pr-4 text-white placeholder-white/50 focus:outline-none focus:border-primary transition-colors">
                    </div>
                </div>
                <div id="explore-list" class="flex-1 overflow-y-auto no-scrollbar p-2">
                    <!-- Explore list rendered here -->
                    <div class="flex flex-col items-center justify-center py-20 opacity-70">
                        <i class="fa-solid fa-satellite-dish text-4xl animate-pulse mb-4 text-primary"></i>
                        <p class="text-sm tracking-wide">Syncing Frequencies...</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Hidden Audio Engine -->
    <audio id="audio-engine" preload="auto" crossorigin="anonymous"></audio>

    <script>
        /**
         * PWA & Service Worker
         */
        function setupPWA() {
            const manifest = {
                name: "RelayBox FM",
                short_name: "RelayBox",
                description: "Ultra-modern deep-buffer internet radio.",
                start_url: ".",
                display: "standalone",
                background_color: "#0f172a",
                theme_color: "#0f172a",
                icons: [{ src: "https://placehold.co/512x512/ec4899/ffffff?text=RB", sizes: "512x512", type: "image/png" }]
            };
            document.getElementById('manifest-link').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
            
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' })));
            }
        }

        /**
         * Core Application Logic
         */
        class RelayBoxApp {
            constructor() {
                // State
                this.stations = JSON.parse(localStorage.getItem('rb_stations_cache')) || [];
                this.favorites = JSON.parse(localStorage.getItem('rb_favorites')) || [];
                this.currentStation = null;
                this.isPlaying = false;
                
                // Buffer Engine
                this.isBuffering = false;
                this.bufferInterval = null;
                this.bufferTargetSeconds = 30; // Protect against Screen-Off Doze
                
                // DOM Cache
                this.audio = document.getElementById('audio-engine');
                this.playerStage = document.getElementById('player-stage');
                this.iconPlay = document.getElementById('icon-play');
                this.iconFav = document.getElementById('icon-fav');
                
                this.init();
            }

            async init() {
                this.setupAudioListeners();
                
                // If we have cached stations, render immediately. Fetch in background.
                if (this.stations.length > 0) {
                    this.renderExploreList(this.stations);
                    this.fetchStations(true); // silent background update
                } else {
                    await this.fetchStations(false);
                }

                this.renderFavoritesList();

                // Auto-play random if nothing is playing on fresh load
                if (this.stations.length > 0) {
                    this.setStation(this.stations[Math.floor(Math.random() * this.stations.length)], false);
                }
            }

            async fetchStations(silent = false) {
                try {
                    const res = await fetch('https://de1.api.radio-browser.info/json/stations/search?language=malayalam&hidebroken=true&limit=500&order=clickcount&reverse=true');
                    const data = await res.json();
                    this.stations = data.filter(s => s.url_resolved && s.codec !== 'UNKNOWN');
                    localStorage.setItem('rb_stations_cache', JSON.stringify(this.stations));
                    
                    if (!silent) this.renderExploreList(this.stations);
                } catch (error) {
                    console.error("API Error:", error);
                    if (!silent && this.stations.length === 0) {
                        document.getElementById('explore-list').innerHTML = `<div class="text-center text-red-400 py-10">Network Error. Check connection.</div>`;
                    }
                }
            }

            /**
             * Artwork Fetcher Logic
             * 1. Favicon
             * 2. Clearbit Logo via Homepage Hostname
             * 3. UI-Avatars Fallback
             */
            getArtwork(station) {
                if (station.favicon && station.favicon.trim() !== '') return station.favicon;
                if (station.homepage && station.homepage.trim() !== '') {
                    try {
                        const url = new URL(station.homepage);
                        return `https://logo.clearbit.com/${url.hostname}`;
                    } catch(e) {}
                }
                return this.getAvatarFallback(station.name);
            }

            getAvatarFallback(name) {
                return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'FM')}&background=random&color=fff&size=256`;
            }

            /**
             * Tab Navigation
             */
            switchTab(tabId) {
                ['player', 'favorites', 'explore'].forEach(id => {
                    document.getElementById(`view-${id}`).classList.add('hidden');
                    const navBtn = document.getElementById(`nav-${id}`);
                    navBtn.classList.remove('tab-active');
                    navBtn.classList.add('tab-inactive');
                });
                
                document.getElementById(`view-${tabId}`).classList.remove('hidden');
                const activeNav = document.getElementById(`nav-${tabId}`);
                activeNav.classList.remove('tab-inactive');
                activeNav.classList.add('tab-active');
            }

            /**
             * List Renderers
             */
            createListItem(station) {
                const thumb = this.getArtwork(station);
                const tags = station.tags ? station.tags.split(',').slice(0, 2).join(', ') : 'Malayalam Radio';
                // Escape single quotes for inline JS
                const safeStationJSON = JSON.stringify(station).replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                return `
                    <div class="flex items-center gap-4 p-3 rounded-2xl hover:bg-white/5 cursor-pointer transition-colors border-b border-white/5" onclick="app.playStationFromList('${station.stationuuid}')">
                        <img src="${thumb}" onerror="this.onerror=null; this.src='${this.getAvatarFallback(station.name)}';" class="w-14 h-14 rounded-xl object-cover shadow-md bg-black/20">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-semibold text-white truncate text-base">${station.name}</h4>
                            <p class="text-xs text-white/50 truncate capitalize">${tags}</p>
                        </div>
                        <button onclick="event.stopPropagation(); app.toggleFavoriteById('${station.stationuuid}')" class="w-10 h-10 flex items-center justify-center text-xl ${this.isFavorite(station.stationuuid) ? 'text-yellow-400' : 'text-gray-500 hover:text-white'} transition-colors">
                            <i class="${this.isFavorite(station.stationuuid) ? 'fa-solid' : 'fa-regular'} fa-star"></i>
                        </button>
                    </div>
                `;
            }

            renderExploreList(list) {
                const container = document.getElementById('explore-list');
                if (list.length === 0) {
                    container.innerHTML = `<div class="text-center py-10 text-white/50">No stations found.</div>`;
                    return;
                }
                container.innerHTML = list.map(s => this.createListItem(s)).join('');
            }

            renderFavoritesList() {
                const container = document.getElementById('favorites-list');
                if (this.favorites.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-20 opacity-50">
                            <i class="fa-regular fa-star text-5xl mb-4"></i>
                            <p>No favorites yet.</p>
                            <p class="text-xs mt-2">Star stations in the Explore tab.</p>
                        </div>
                    `;
                    return;
                }
                container.innerHTML = this.favorites.map(s => this.createListItem(s)).join('');
            }

            filterStations() {
                const query = document.getElementById('search-input').value.toLowerCase();
                const filtered = this.stations.filter(s => s.name.toLowerCase().includes(query) || (s.tags && s.tags.toLowerCase().includes(query)));
                this.renderExploreList(filtered);
            }

            /**
             * Favorites Management
             */
            isFavorite(uuid) {
                return this.favorites.some(s => s.stationuuid === uuid);
            }

            toggleFavoriteById(uuid) {
                const station = this.stations.find(s => s.stationuuid === uuid) || this.currentStation;
                if (!station) return;
                
                if (this.isFavorite(uuid)) {
                    this.favorites = this.favorites.filter(s => s.stationuuid !== uuid);
                } else {
                    this.favorites.push(station);
                }
                
                localStorage.setItem('rb_favorites', JSON.stringify(this.favorites));
                this.renderFavoritesList();
                this.renderExploreList(this.stations); // Re-render to update star icons
                this.updatePlayerFavIcon();
            }

            toggleFavorite() {
                if (this.currentStation) {
                    this.toggleFavoriteById(this.currentStation.stationuuid);
                }
            }

            updatePlayerFavIcon() {
                if (!this.currentStation) return;
                if (this.isFavorite(this.currentStation.stationuuid)) {
                    this.iconFav.className = "fa-solid fa-star text-yellow-400 drop-shadow-md";
                } else {
                    this.iconFav.className = "fa-regular fa-star text-gray-400";
                }
            }

            /**
             * Playback & Buffering Engine
             */
            playStationFromList(uuid) {
                const station = this.stations.find(s => s.stationuuid === uuid) || this.favorites.find(s => s.stationuuid === uuid);
                if (station) {
                    this.setStation(station, true);
                    this.switchTab('player');
                }
            }

            playRandom() {
                if (this.stations.length === 0) return;
                const randomIndex = Math.floor(Math.random() * this.stations.length);
                this.setStation(this.stations[randomIndex], true);
            }

            setStation(station, autoPlay = false) {
                this.currentStation = station;
                const thumb = this.getArtwork(station);
                const tags = station.tags ? station.tags.split(',').slice(0, 3).join(', ') : 'Malayalam Radio';

                // Update UI
                document.getElementById('player-name').textContent = station.name;
                document.getElementById('player-now-playing').textContent = `Now Playing: ${tags}`;
                
                const imgEl = document.getElementById('player-thumb');
                imgEl.src = thumb;
                imgEl.onerror = () => { imgEl.src = this.getAvatarFallback(station.name); };
                
                document.getElementById('player-bg-blur').style.backgroundImage = `url('${thumb}')`;
                
                this.updatePlayerFavIcon();
                this.setupMediaSession();

                // Stop any current playback/buffering
                this.audio.pause();
                clearInterval(this.bufferInterval);
                this.isBuffering = false;
                
                // Preload to start downloading data to cache
                this.audio.src = station.url_resolved;
                this.audio.load();
                
                this.updatePlayerStateUI();

                if (autoPlay) {
                    this.startBufferingEngine();
                }
            }

            startBufferingEngine() {
                clearInterval(this.bufferInterval);
                this.isBuffering = true;
                this.isPlaying = false;
                
                // 30 Seconds Buffer to survive screen-off connection drops
                let countdown = this.bufferTargetSeconds; 
                
                const overlay = document.getElementById('buffer-overlay');
                const countText = document.getElementById('buffer-count');
                
                overlay.classList.remove('hidden');
                countText.textContent = countdown;
                this.updatePlayerStateUI();

                this.bufferInterval = setInterval(() => {
                    countdown--;
                    countText.textContent = countdown;
                    
                    if (countdown <= 0) {
                        clearInterval(this.bufferInterval);
                        this.executePlay();
                    }
                }, 1000);
            }

            executePlay() {
                this.isBuffering = false;
                document.getElementById('buffer-overlay').classList.add('hidden');
                
                this.audio.play().then(() => {
                    this.isPlaying = true;
                    this.updatePlayerStateUI();
                }).catch(err => {
                    console.warn("Autoplay prevented or network error:", err);
                    this.isPlaying = false;
                    document.getElementById('player-now-playing').textContent = 'Playback Error - Tap Play';
                    this.updatePlayerStateUI();
                });
            }

            togglePlay() {
                if (!this.currentStation) {
                    this.playRandom();
                    return;
                }

                if (this.isBuffering) {
                    // Cancel buffering
                    clearInterval(this.bufferInterval);
                    this.isBuffering = false;
                    document.getElementById('buffer-overlay').classList.add('hidden');
                    this.updatePlayerStateUI();
                    return;
                }

                if (this.isPlaying) {
                    this.audio.pause();
                    this.isPlaying = false;
                } else {
                    // If manually resuming, we can bypass the 30s forced buffer 
                    // (assume user wants immediate sound, or start buffer again?)
                    // Let's just play normally here to maintain responsive feel.
                    this.audio.play().catch(e => console.error(e));
                    this.isPlaying = true;
                }
                this.updatePlayerStateUI();
            }

            updatePlayerStateUI() {
                // Vinyl Spin Animation
                if (this.isPlaying) {
                    this.playerStage.classList.remove('is-paused');
                    this.playerStage.classList.add('is-playing');
                } else if (this.isBuffering || this.audio.paused) {
                    this.playerStage.classList.remove('is-playing');
                    this.playerStage.classList.add('is-paused');
                }

                // Play Button Icon
                if (this.isBuffering) {
                    this.iconPlay.className = "fa-solid fa-xmark text-4xl ml-0 text-white/80"; // Cancel button during buffer
                } else if (this.isPlaying) {
                    this.iconPlay.className = "fa-solid fa-pause text-4xl ml-0";
                } else {
                    this.iconPlay.className = "fa-solid fa-play text-4xl ml-2";
                }
            }

            setupAudioListeners() {
                this.audio.addEventListener('error', () => {
                    this.isPlaying = false;
                    this.isBuffering = false;
                    document.getElementById('buffer-overlay').classList.add('hidden');
                    document.getElementById('player-now-playing').textContent = 'Stream Offline';
                    this.updatePlayerStateUI();
                });
                
                this.audio.addEventListener('playing', () => {
                    this.isPlaying = true;
                    this.isBuffering = false;
                    document.getElementById('buffer-overlay').classList.add('hidden');
                    this.updatePlayerStateUI();
                });
            }

            setupMediaSession() {
                if ('mediaSession' in navigator && this.currentStation) {
                    const thumb = this.getArtwork(this.currentStation);
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: this.currentStation.name,
                        artist: 'RelayBox FM',
                        album: 'Live Radio',
                        artwork: [ { src: thumb, sizes: '512x512', type: 'image/png' } ]
                    });

                    navigator.mediaSession.setActionHandler('play', () => this.togglePlay());
                    navigator.mediaSession.setActionHandler('pause', () => this.togglePlay());
                    navigator.mediaSession.setActionHandler('nexttrack', () => this.playRandom());
                }
            }
        }

        // Boot Application
        window.addEventListener('DOMContentLoaded', () => {
            setupPWA();
            window.app = new RelayBoxApp();
        });

    </script>
</body>
</html>
