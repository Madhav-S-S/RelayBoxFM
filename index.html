<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepBuffer Radio</title>
    
    <!-- Dynamic Manifest Link -->
    <link id="manifest-link" rel="manifest" href="">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#3b82f6',
                        dark: '#111827',
                        darker: '#030712',
                        panel: '#1f2937'
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for a more app-like feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* Prevent accidental selection on mobile */
        }
        
        .glass-panel {
            background: rgba(31, 41, 55, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .spin-slow {
            animation: spin 3s linear infinite;
        }

        /* Pulse animation for buffering */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .buffering-indicator {
            animation: pulse-ring 1.5s infinite;
        }
    </style>
</head>
<body class="bg-darker text-white h-screen w-screen overflow-hidden flex flex-col font-sans">

    <!-- Header -->
    <header class="pt-10 pb-4 px-4 bg-dark shadow-md flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-purple-600 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-radio text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl leading-tight">DeepBuffer<span class="text-primary">FM</span></h1>
                <p class="text-xs text-gray-400">Malayalam Streams</p>
            </div>
        </div>
        <button id="install-btn" class="hidden bg-gray-800 hover:bg-gray-700 text-white rounded-full px-4 py-2 text-sm transition font-medium">
            Install App
        </button>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex gap-2 px-4 py-3 bg-dark overflow-x-auto no-scrollbar shrink-0 border-b border-gray-800">
        <button onclick="app.switchTab('top')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium transition bg-primary text-white" data-tab="top">Top Stations</button>
        <button onclick="app.switchTab('genres')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium transition bg-gray-800 text-gray-300 hover:bg-gray-700" data-tab="genres">Categories</button>
        <button onclick="app.switchTab('favorites')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium transition bg-gray-800 text-gray-300 hover:bg-gray-700" data-tab="favorites">Favorites</button>
        <button onclick="app.switchTab('custom')" class="tab-btn px-4 py-2 rounded-full text-sm font-medium transition bg-gray-800 text-gray-300 hover:bg-gray-700" data-tab="custom">Custom URL</button>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 pb-32 relative" id="main-content">
        
        <!-- Top Stations View -->
        <div id="view-top" class="view-section grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Dynamically populated -->
        </div>

        <!-- Genres View -->
        <div id="view-genres" class="view-section hidden">
            <div class="flex flex-wrap gap-2" id="genres-container">
                <!-- Dynamically populated -->
            </div>
            <h2 class="text-lg font-bold mt-6 mb-4 hidden" id="genre-title">Stations in Category</h2>
            <div id="genre-stations" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>

        <!-- Favorites View -->
        <div id="view-favorites" class="view-section hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- Dynamically populated -->
        </div>

        <!-- Custom URL View -->
        <div id="view-custom" class="view-section hidden max-w-lg mx-auto mt-4">
            <div class="bg-panel p-6 rounded-2xl border border-gray-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4">Add Custom Stream</h2>
                <p class="text-sm text-gray-400 mb-6">Paste a direct radio URL. We will try to auto-fetch the station details.</p>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Stream URL</label>
                        <input type="text" id="custom-url" placeholder="https://..." class="w-full bg-darker border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary transition">
                    </div>
                    
                    <div id="auto-fetch-loader" class="hidden text-primary text-sm font-medium flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Fetching details from directory...
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Station Name</label>
                        <input type="text" id="custom-name" placeholder="My Awesome Station" class="w-full bg-darker border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Thumbnail URL (Optional)</label>
                        <input type="text" id="custom-thumb" placeholder="https://..." class="w-full bg-darker border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary transition">
                    </div>

                    <button onclick="app.saveCustomStation()" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition mt-4">
                        Save & Play
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="global-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-darker z-10">
            <i class="fa-solid fa-satellite-dish text-4xl text-primary animate-pulse mb-4"></i>
            <p class="text-gray-400 font-medium">Tuning in...</p>
        </div>

    </main>

    <!-- Persistent Bottom Player -->
    <div class="fixed bottom-0 left-0 right-0 glass-panel border-t border-gray-700 p-3 sm:p-4 z-50 transform transition-transform duration-300 translate-y-full" id="player-bar">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
            
            <div class="flex items-center gap-3 overflow-hidden flex-1">
                <div class="relative w-12 h-12 sm:w-14 sm:h-14 rounded-lg bg-gray-800 overflow-hidden shrink-0 shadow-md">
                    <img id="player-thumb" src="" alt="Thumbnail" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/1f2937/ffffff?text=FM'">
                    <div id="player-buffering" class="absolute inset-0 bg-black/60 flex items-center justify-center hidden">
                        <i class="fa-solid fa-circle-notch text-primary spin-slow text-xl buffering-indicator"></i>
                    </div>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <h3 id="player-name" class="font-bold text-sm sm:text-base text-white truncate">Select a Station</h3>
                    <p id="player-status" class="text-xs text-primary font-medium truncate">Ready</p>
                </div>
            </div>

            <div class="flex items-center gap-3 shrink-0">
                <button onclick="app.toggleFavoriteCurrent()" id="btn-fav" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-gray-800 transition">
                    <i class="fa-regular fa-heart text-xl"></i>
                </button>
                
                <button onclick="app.togglePlay()" id="btn-play" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-primary hover:bg-blue-600 text-white flex items-center justify-center shadow-lg transition transform active:scale-95">
                    <i class="fa-solid fa-play text-xl ml-1" id="icon-play"></i>
                </button>
            </div>
            
        </div>
        
        <!-- Deep Buffer Config / Status line -->
        <div class="max-w-4xl mx-auto mt-2 px-1 flex justify-between items-center text-[10px] text-gray-500">
            <span>Buffer Engine: <span id="buffer-metric">0s</span></span>
            <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved"></i> Doze Protected</span>
        </div>
    </div>

    <!-- Hidden Audio Element for actual playback -->
    <!-- preload="auto" is key here to start fetching immediately before play -->
    <audio id="audio-engine" preload="auto" crossorigin="anonymous"></audio>

    <script>
        /**
         * PWA & Service Worker Generation (Single File Approach)
         */
        function setupPWA() {
            // 1. Generate Manifest
            const manifest = {
                name: "DeepBuffer Radio",
                short_name: "DB Radio",
                description: "Internet Radio with Screen-Off deep buffering.",
                start_url: ".",
                display: "standalone",
                background_color: "#111827",
                theme_color: "#111827",
                icons: [
                    { src: "https://placehold.co/192x192/3b82f6/ffffff?text=DB", sizes: "192x192", type: "image/png" },
                    { src: "https://placehold.co/512x512/3b82f6/ffffff?text=DB", sizes: "512x512", type: "image/png" }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

            // 2. Generate Service Worker
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    // Minimal SW just to pass PWA requirements. 
                    // Network requests pass through normally.
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
                });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(URL.createObjectURL(swBlob))
                    .then(() => console.log('Service Worker Registered'))
                    .catch(err => console.error('SW Registration failed', err));
            }

            // 3. Install Prompt handling
            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const installBtn = document.getElementById('install-btn');
                installBtn.classList.remove('hidden');
                installBtn.addEventListener('click', async () => {
                    installBtn.classList.add('hidden');
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                });
            });
        }

        /**
         * Application Logic
         */
        class RadioApp {
            constructor() {
                this.apiBase = 'https://de1.api.radio-browser.info/json';
                this.stations = { top: [], genres: [], favorites: [], custom: [] };
                this.currentStation = null;
                this.isPlaying = false;
                this.isBuffering = false;
                this.bufferTargetSeconds = 5; // Target seconds to buffer before playing
                this.bufferInterval = null;

                // DOM Elements
                this.audio = document.getElementById('audio-engine');
                this.playerBar = document.getElementById('player-bar');
                this.btnPlay = document.getElementById('btn-play');
                this.iconPlay = document.getElementById('icon-play');
                this.playerThumb = document.getElementById('player-thumb');
                this.playerName = document.getElementById('player-name');
                this.playerStatus = document.getElementById('player-status');
                this.playerBuffering = document.getElementById('player-buffering');
                this.btnFav = document.getElementById('btn-fav');
                this.globalLoader = document.getElementById('global-loader');
                this.bufferMetric = document.getElementById('buffer-metric');

                this.init();
            }

            async init() {
                this.loadStorage();
                this.setupAudioListeners();
                this.setupCustomUrlListener();
                
                await this.fetchTopStations();
                this.switchTab('top');
                
                setTimeout(() => {
                    this.globalLoader.classList.add('hidden');
                }, 500);
            }

            // --- API Calls ---

            async api(endpoint) {
                try {
                    const res = await fetch(`${this.apiBase}${endpoint}`);
                    return await res.json();
                } catch (error) {
                    console.error("API Error:", error);
                    return [];
                }
            }

            async fetchTopStations() {
                const data = await this.api('/stations/search?language=malayalam&order=clickcount&reverse=true&limit=40');
                this.stations.top = data.filter(s => s.url_resolved && s.codec !== 'UNKNOWN');
                this.renderStations(this.stations.top, 'view-top');
            }

            async fetchGenres() {
                const malayalamCategories = ['music', 'news', 'devotional', 'christian', 'hindu', 'islamic', 'talk', 'classic'];
                const container = document.getElementById('genres-container');
                container.innerHTML = malayalamCategories.map(tag => `
                    <button onclick="app.fetchStationsByGenre('${tag}')" 
                            class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-lg text-sm border border-gray-700 transition capitalize">
                        ${this.capitalize(tag)}
                    </button>
                `).join('');
            }

            async fetchStationsByGenre(genre) {
                this.globalLoader.classList.remove('hidden');
                const data = await this.api(`/stations/search?language=malayalam&tag=${encodeURIComponent(genre)}&limit=20&order=clickcount&reverse=true`);
                const title = document.getElementById('genre-title');
                title.textContent = `Stations: ${this.capitalize(genre)}`;
                title.classList.remove('hidden');
                
                this.renderStations(data.filter(s => s.url_resolved), 'genre-stations');
                this.globalLoader.classList.add('hidden');
            }

            // --- UI Rendering ---

            switchTab(tabId) {
                // Update buttons
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    if (btn.dataset.tab === tabId) {
                        btn.classList.replace('bg-gray-800', 'bg-primary');
                        btn.classList.replace('text-gray-300', 'text-white');
                        btn.classList.remove('hover:bg-gray-700');
                    } else {
                        btn.classList.replace('bg-primary', 'bg-gray-800');
                        btn.classList.replace('text-white', 'text-gray-300');
                        btn.classList.add('hover:bg-gray-700');
                    }
                });

                // Update views
                document.querySelectorAll('.view-section').forEach(view => view.classList.add('hidden'));
                document.getElementById(`view-${tabId}`).classList.remove('hidden');

                if (tabId === 'genres' && document.getElementById('genres-container').children.length === 0) {
                    this.fetchGenres();
                } else if (tabId === 'favorites') {
                    this.renderStations([...this.stations.favorites, ...this.stations.custom], 'view-favorites');
                }
            }

            renderStations(stations, containerId) {
                const container = document.getElementById(containerId);
                if (stations.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">No stations found.</div>`;
                    return;
                }

                container.innerHTML = stations.map(s => {
                    const thumb = s.favicon || `https://placehold.co/300x300/1f2937/ffffff?text=${s.name.substring(0,2).toUpperCase()}`;
                    const isFav = this.stations.favorites.some(f => f.stationuuid === s.stationuuid) || this.stations.custom.some(c => c.url === s.url);
                    
                    // Sanitize data for inline string
                    const safeName = s.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const safeUrl = (s.url_resolved || s.url).replace(/'/g, "\\'");
                    const safeThumb = thumb.replace(/'/g, "\\'");

                    return `
                        <div class="bg-panel rounded-xl overflow-hidden shadow-lg border border-gray-800 group relative">
                            <div class="aspect-square bg-gray-800 relative">
                                <img src="${thumb}" onerror="this.src='https://placehold.co/300x300/1f2937/ffffff?text=FM'" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" alt="${s.name}">
                                
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-3 backdrop-blur-sm">
                                    <button onclick="app.playStation('${safeName}', '${safeUrl}', '${safeThumb}', '${s.stationuuid || 'custom'}')" class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center transform hover:scale-110 transition shadow-lg">
                                        <i class="fa-solid fa-play ml-1"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="p-3">
                                <h3 class="font-bold text-sm text-white truncate">${s.name}</h3>
                                <p class="text-xs text-gray-400 truncate">${s.tags ? s.tags.split(',')[0] : (s.codec || 'Custom')}</p>
                            </div>
                            ${isFav ? `<div class="absolute top-2 right-2 text-red-500"><i class="fa-solid fa-heart drop-shadow-md"></i></div>` : ''}
                        </div>
                    `;
                }).join('');
            }

            // --- Custom URL Logic ---

            setupCustomUrlListener() {
                const urlInput = document.getElementById('custom-url');
                let timeout = null;
                urlInput.addEventListener('input', (e) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => this.checkCustomUrl(e.target.value), 800);
                });
            }

            async checkCustomUrl(url) {
                if (!url.startsWith('http')) return;
                
                const loader = document.getElementById('auto-fetch-loader');
                loader.classList.remove('hidden');
                
                try {
                    const data = await this.api(`/stations/byurl?url=${encodeURIComponent(url)}`);
                    if (data && data.length > 0) {
                        const station = data[0];
                        if (station.name) document.getElementById('custom-name').value = station.name;
                        if (station.favicon) document.getElementById('custom-thumb').value = station.favicon;
                    }
                } catch (e) {
                    console.log('No metadata found for custom url');
                }
                loader.classList.add('hidden');
            }

            saveCustomStation() {
                const url = document.getElementById('custom-url').value;
                const name = document.getElementById('custom-name').value || 'Custom Stream';
                const thumb = document.getElementById('custom-thumb').value || `https://placehold.co/300x300/1f2937/ffffff?text=CU`;

                if (!url) return;

                const station = { url, url_resolved: url, name, favicon: thumb, stationuuid: 'custom-' + Date.now(), codec: 'Custom' };
                this.stations.custom.push(station);
                this.saveStorage();
                
                document.getElementById('custom-url').value = '';
                document.getElementById('custom-name').value = '';
                document.getElementById('custom-thumb').value = '';
                
                this.switchTab('favorites');
                this.playStation(name, url, thumb, station.stationuuid);
            }

            // --- Deep Audio Buffering Engine ---

            setupAudioListeners() {
                this.audio.addEventListener('error', (e) => {
                    this.playerStatus.textContent = 'Connection Error - Retrying...';
                    this.playerStatus.classList.replace('text-primary', 'text-red-500');
                    this.isBuffering = false;
                    this.updatePlayPauseIcon();
                    
                    // Auto reconnect logic
                    if (this.currentStation) {
                        setTimeout(() => {
                            if (!this.isPlaying) return;
                            this.audio.load();
                            this.startBufferingEngine();
                        }, 5000);
                    }
                });

                this.audio.addEventListener('ended', () => {
                    // Radio streams shouldn't end, if they do, reconnect
                    if (this.isPlaying && this.currentStation) {
                        this.audio.load();
                        this.startBufferingEngine();
                    }
                });
            }

            playStation(name, url, thumb, id) {
                this.currentStation = { name, url, thumb, id };
                
                // Show & Update Player Bar
                this.playerBar.classList.remove('translate-y-full');
                this.playerName.textContent = name;
                this.playerThumb.src = thumb;
                this.updateFavoriteIcon();
                
                // Prepare Audio Object
                this.audio.src = url;
                this.audio.load(); // Forces fetch to begin immediately
                this.isPlaying = true;
                
                this.setupMediaSession();
                this.startBufferingEngine();
            }

            startBufferingEngine() {
                // The core technique to survive screen-off:
                // Instead of calling audio.play() immediately, which forces a minimal real-time buffer,
                // we keep audio paused while it downloads in the background (preload="auto" is set).
                // We monitor `audio.buffered` until it has enough seconds ahead before commencing playback.
                
                clearInterval(this.bufferInterval);
                this.isBuffering = true;
                this.updatePlayPauseIcon();
                this.playerBuffering.classList.remove('hidden');
                this.playerStatus.textContent = 'Filling Deep Buffer...';
                this.playerStatus.classList.replace('text-red-500', 'text-primary');

                this.bufferInterval = setInterval(() => {
                    if (!this.isPlaying) {
                        clearInterval(this.bufferInterval);
                        return;
                    }

                    let bufferedSeconds = 0;
                    if (this.audio.buffered.length > 0) {
                        const end = this.audio.buffered.end(this.audio.buffered.length - 1);
                        bufferedSeconds = end - this.audio.currentTime;
                    }

                    this.bufferMetric.textContent = `${bufferedSeconds.toFixed(1)}s`;

                    // If we reached our target buffer, OR if the browser signals it has enough data (readyState 4)
                    if (bufferedSeconds >= this.bufferTargetSeconds || this.audio.readyState === 4) {
                        clearInterval(this.bufferInterval);
                        this.executePlay();
                    }
                    
                    // Fallback: If network is slow and after 10 seconds we haven't buffered much, 
                    // just try to play anyway to avoid infinite loading.
                    if (this.audio.readyState >= 3 && bufferedSeconds > 1) {
                         // We have SOME future data. Wait a bit more, but if it takes too long...
                         // (Keeping it simple for this implementation: let's rely on the above condition).
                    }
                }, 500);
                
                // Fallback timeout: If buffer check fails to read (some streams don't expose buffer), force play after 4 seconds
                setTimeout(() => {
                    if (this.isBuffering && this.isPlaying) {
                        clearInterval(this.bufferInterval);
                        this.executePlay();
                    }
                }, 4000);
            }

            executePlay() {
                this.isBuffering = false;
                this.playerBuffering.classList.add('hidden');
                this.playerStatus.textContent = 'Playing';
                this.updatePlayPauseIcon();
                
                this.audio.play().catch(e => {
                    console.error("Playback failed:", e);
                    this.playerStatus.textContent = 'Tap Play to start';
                    this.isPlaying = false;
                    this.updatePlayPauseIcon();
                });
            }

            togglePlay() {
                if (!this.currentStation) return;
                
                if (this.isPlaying) {
                    this.isPlaying = false;
                    this.isBuffering = false;
                    clearInterval(this.bufferInterval);
                    this.audio.pause();
                    this.playerBuffering.classList.add('hidden');
                    this.playerStatus.textContent = 'Paused';
                } else {
                    this.isPlaying = true;
                    // Re-initiate buffering sequence to build up safety net again
                    this.startBufferingEngine();
                }
                this.updatePlayPauseIcon();
            }

            updatePlayPauseIcon() {
                if (this.isBuffering) {
                    this.iconPlay.className = "fa-solid fa-hourglass-half";
                } else if (this.isPlaying) {
                    this.iconPlay.className = "fa-solid fa-pause";
                } else {
                    this.iconPlay.className = "fa-solid fa-play ml-1";
                }
            }

            // --- Media Session API (Critical for Screen-Off / Background Play) ---
            
            setupMediaSession() {
                if ('mediaSession' in navigator && this.currentStation) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: this.currentStation.name,
                        artist: 'DeepBuffer Radio',
                        album: 'Continuous Stream',
                        artwork: [
                            { src: this.currentStation.thumb, sizes: '300x300', type: 'image/png' }
                        ]
                    });

                    navigator.mediaSession.setActionHandler('play', () => this.togglePlay());
                    navigator.mediaSession.setActionHandler('pause', () => this.togglePlay());
                    navigator.mediaSession.setActionHandler('stop', () => {
                        this.isPlaying = false;
                        this.audio.pause();
                        this.updatePlayPauseIcon();
                    });
                }
            }

            // --- Favorites & Storage ---

            toggleFavoriteCurrent() {
                if (!this.currentStation) return;
                
                const id = this.currentStation.id;
                const idx = this.stations.favorites.findIndex(s => s.stationuuid === id);
                
                if (idx > -1) {
                    this.stations.favorites.splice(idx, 1);
                } else {
                    // Check if it's a custom station
                    if (id.startsWith('custom-')) {
                        // Already saved in custom array
                        const cIdx = this.stations.custom.findIndex(c => c.stationuuid === id);
                        if(cIdx > -1) {
                            this.stations.custom.splice(cIdx, 1);
                            this.currentStation = null;
                            this.audio.pause();
                            this.playerBar.classList.add('translate-y-full');
                        }
                    } else {
                        // Find station full object from top or genres
                        const fullObj = {
                            name: this.currentStation.name,
                            url: this.currentStation.url,
                            url_resolved: this.currentStation.url,
                            favicon: this.currentStation.thumb,
                            stationuuid: this.currentStation.id,
                            codec: 'Directory'
                        };
                        this.stations.favorites.push(fullObj);
                    }
                }
                
                this.saveStorage();
                this.updateFavoriteIcon();
                
                // Re-render favorites tab if active
                if (!document.getElementById('view-favorites').classList.contains('hidden')) {
                    this.renderStations([...this.stations.favorites, ...this.stations.custom], 'view-favorites');
                }
            }

            updateFavoriteIcon() {
                if (!this.currentStation) return;
                const isFav = this.stations.favorites.some(f => f.stationuuid === this.currentStation.id) || 
                              this.stations.custom.some(c => c.stationuuid === this.currentStation.id);
                
                if (isFav) {
                    this.btnFav.innerHTML = '<i class="fa-solid fa-heart text-xl text-red-500"></i>';
                } else {
                    this.btnFav.innerHTML = '<i class="fa-regular fa-heart text-xl"></i>';
                }
            }

            saveStorage() {
                localStorage.setItem('dbradio_favs', JSON.stringify(this.stations.favorites));
                localStorage.setItem('dbradio_custom', JSON.stringify(this.stations.custom));
            }

            loadStorage() {
                try {
                    const favs = localStorage.getItem('dbradio_favs');
                    const cust = localStorage.getItem('dbradio_custom');
                    if (favs) this.stations.favorites = JSON.parse(favs);
                    if (cust) this.stations.custom = JSON.parse(cust);
                } catch (e) {
                    console.error("Local storage error", e);
                }
            }

            capitalize(str) {
                return str.charAt(0).toUpperCase() + str.slice(1);
            }
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            setupPWA();
            window.app = new RadioApp();
        });

    </script>
</body>
