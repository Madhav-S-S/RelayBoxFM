<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RelayBox FM</title>
    
    <!-- Dynamic Manifest Link -->
    <link id="manifest-link" rel="manifest" href="">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#ec4899', // Pink
                        secondary: '#8b5cf6', // Purple
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for a more app-like feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* Animated Gradient Mesh Background */
        .bg-mesh {
            background: linear-gradient(-45deg, #0f172a, #312e81, #701a75, #1e1b4b, #111827);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(17, 24, 39, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .glass-btn:active {
            transform: translateY(0);
        }

        /* Vinyl Record Spin */
        .vinyl {
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .vinyl::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15%;
            height: 15%;
            background: #111827;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 10;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .is-playing .vinyl {
            animation: spin 5s linear infinite;
        }

        .is-paused .vinyl {
            animation: spin 5s linear infinite;
            animation-play-state: paused;
        }

        /* Pulse animation for buffering */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
        .buffering-indicator {
            animation: pulse-ring 1.5s infinite;
        }

        /* Smooth fade in */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-white">

    <div class="bg-mesh"></div>

    <div class="h-screen w-screen flex flex-col relative z-10 p-4 sm:p-6 max-w-2xl mx-auto">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 shrink-0 fade-in">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary to-secondary flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-broadcast-tower text-white"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-2xl leading-none tracking-tight">RelayBox<span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">FM</span></h1>
                </div>
            </div>
            <button id="install-btn" class="hidden glass-btn text-white rounded-full px-4 py-1.5 text-xs font-semibold uppercase tracking-wider">
                Install
            </button>
        </header>

        <!-- Main Player Stage -->
        <section class="glass rounded-3xl p-6 sm:p-8 flex flex-col items-center justify-center mb-6 shrink-0 shadow-2xl relative overflow-hidden fade-in" style="animation-delay: 0.1s;">
            
            <!-- Background Blur image (dynamic) -->
            <div id="player-bg-blur" class="absolute inset-0 bg-cover bg-center opacity-20 filter blur-3xl mix-blend-overlay transition-all duration-1000"></div>

            <div id="player-stage" class="relative z-10 flex flex-col items-center w-full">
                
                <!-- Circular Thumbnail (Vinyl) -->
                <div class="relative w-40 h-40 sm:w-56 sm:h-56 mb-6">
                    <img id="player-thumb" src="https://placehold.co/400x400/1e1b4b/ffffff?text=FM" alt="Radio" class="w-full h-full object-cover vinyl shadow-2xl">
                    
                    <!-- Buffering Overlay -->
                    <div id="player-buffering" class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center hidden z-20 backdrop-blur-sm">
                        <i class="fa-solid fa-circle-notch text-primary text-3xl animate-spin"></i>
                    </div>
                </div>

                <!-- Station Info -->
                <div class="text-center w-full mb-8">
                    <h2 id="player-name" class="text-2xl sm:text-3xl font-bold truncate mb-1 text-white drop-shadow-md">Connecting...</h2>
                    <p id="player-status" class="text-sm font-medium text-pink-400 tracking-wide uppercase">Initializing Data</p>
                </div>

                <!-- Controls -->
                <div class="flex items-center justify-center gap-6 sm:gap-8 w-full">
                    
                    <!-- Random Button -->
                    <button onclick="app.playRandom()" class="glass-btn w-12 h-12 rounded-full flex items-center justify-center text-gray-200 hover:text-white group relative">
                        <i class="fa-solid fa-dice text-xl transition-transform group-hover:rotate-180 duration-500"></i>
                    </button>

                    <!-- Play/Pause Button -->
                    <button onclick="app.togglePlay()" id="btn-play" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-br from-primary to-secondary text-white flex items-center justify-center shadow-[0_0_30px_rgba(236,72,153,0.5)] hover:shadow-[0_0_40px_rgba(236,72,153,0.8)] transition-all transform active:scale-95 border-2 border-white/20">
                        <i class="fa-solid fa-play text-3xl sm:text-4xl ml-2 drop-shadow-md" id="icon-play"></i>
                    </button>

                    <!-- Add to favorites (visual only for balance, or could be functional) -->
                    <button onclick="app.playRandom()" class="glass-btn w-12 h-12 rounded-full flex items-center justify-center text-gray-200 hover:text-white group">
                        <i class="fa-solid fa-shuffle text-lg transition-transform group-hover:-rotate-180 duration-500"></i>
                    </button>

                </div>
            </div>
        </section>

        <!-- Station Grid List -->
        <section class="flex-1 min-h-0 glass rounded-3xl p-4 sm:p-6 shadow-xl flex flex-col fade-in" style="animation-delay: 0.2s;">
            <div class="flex justify-between items-center mb-4 shrink-0 px-2">
                <h3 class="font-semibold text-lg tracking-wide">All Stations</h3>
                <span id="station-count" class="text-xs font-bold bg-white/10 px-3 py-1 rounded-full">0</span>
            </div>
            
            <div id="stations-grid" class="flex-1 overflow-y-auto no-scrollbar grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-y-6 gap-x-4 content-start pb-4">
                <!-- Loader -->
                <div class="col-span-full flex flex-col items-center justify-center py-10 opacity-70">
                    <i class="fa-solid fa-satellite-dish text-3xl animate-pulse mb-3"></i>
                    <p class="text-sm">Scanning Frequencies...</p>
                </div>
            </div>
        </section>

    </div>

    <!-- Hidden Audio Engine -->
    <audio id="audio-engine" preload="auto" crossorigin="anonymous"></audio>

    <script>
        /**
         * PWA & Service Worker Generation
         */
        function setupPWA() {
            const manifest = {
                name: "RelayBox FM",
                short_name: "RelayBox",
                description: "Ultra-modern deep-buffer internet radio.",
                start_url: ".",
                display: "standalone",
                background_color: "#0f172a",
                theme_color: "#0f172a",
                icons: [
                    { src: "https://placehold.co/192x192/ec4899/ffffff?text=RB", sizes: "192x192", type: "image/png" },
                    { src: "https://placehold.co/512x512/ec4899/ffffff?text=RB", sizes: "512x512", type: "image/png" }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
                });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.error(err));
            }

            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const installBtn = document.getElementById('install-btn');
                installBtn.classList.remove('hidden');
                installBtn.addEventListener('click', async () => {
                    installBtn.classList.add('hidden');
                    deferredPrompt.prompt();
                    deferredPrompt = null;
                });
            });
        }

        /**
         * Application Logic
         */
        class RelayBoxApp {
            constructor() {
                // Radio Browser API for up to 500 Malayalam stations
                this.apiUrl = 'https://de1.api.radio-browser.info/json/stations/search?language=malayalam&hidebroken=true&limit=500&order=clickcount&reverse=true';
                this.stations = [];
                this.currentStation = null;
                this.isPlaying = false;
                this.isBuffering = false;
                this.bufferTimeout = null;
                this.bufferTargetSeconds = 3500; // 3.5 seconds deep buffer

                // DOM Elements
                this.audio = document.getElementById('audio-engine');
                this.playerStage = document.getElementById('player-stage');
                this.playerThumb = document.getElementById('player-thumb');
                this.playerBgBlur = document.getElementById('player-bg-blur');
                this.playerName = document.getElementById('player-name');
                this.playerStatus = document.getElementById('player-status');
                this.playerBuffering = document.getElementById('player-buffering');
                this.btnPlay = document.getElementById('btn-play');
                this.iconPlay = document.getElementById('icon-play');
                this.stationsGrid = document.getElementById('stations-grid');
                this.stationCount = document.getElementById('station-count');

                this.init();
            }

            async init() {
                this.setupAudioListeners();
                await this.fetchStations();
                
                if (this.stations.length > 0) {
                    this.playRandom();
                } else {
                    this.playerName.textContent = "No Stations Found";
                    this.playerStatus.textContent = "Error";
                }
            }

            async fetchStations() {
                try {
                    const res = await fetch(this.apiUrl);
                    const data = await res.json();
                    // Filter out invalid URLs
                    this.stations = data.filter(s => s.url_resolved && s.codec !== 'UNKNOWN');
                    this.stationCount.textContent = this.stations.length;
                    this.renderStations();
                } catch (error) {
                    console.error("API Error:", error);
                    this.stationsGrid.innerHTML = `<div class="col-span-full text-center text-red-400 py-10">Network Error. Please refresh.</div>`;
                }
            }

            renderStations() {
                if (this.stations.length === 0) return;

                this.stationsGrid.innerHTML = this.stations.map((s, index) => {
                    const thumb = s.favicon || `https://placehold.co/200x200/1e1b4b/ec4899?text=${s.name.substring(0,2).toUpperCase()}`;
                    const safeName = s.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    return `
                        <div class="flex flex-col items-center cursor-pointer group" onclick="app.playStationByIndex(${index})">
                            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-transparent group-hover:border-primary transition-all duration-300 shadow-lg mb-2 relative">
                                <img src="${thumb}" onerror="this.src='https://placehold.co/200x200/1e1b4b/ec4899?text=FM'" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" loading="lazy">
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                    <i class="fa-solid fa-play text-white text-lg"></i>
                                </div>
                            </div>
                            <h4 class="text-[10px] sm:text-xs text-center font-medium text-gray-300 group-hover:text-white w-full truncate px-1">${s.name}</h4>
                        </div>
                    `;
                }).join('');
            }

            playRandom() {
                if (this.stations.length === 0) return;
                const randomIndex = Math.floor(Math.random() * this.stations.length);
                this.playStationByIndex(randomIndex);
            }

            playStationByIndex(index) {
                const s = this.stations[index];
                const thumb = s.favicon || `https://placehold.co/400x400/1e1b4b/ec4899?text=${s.name.substring(0,2).toUpperCase()}`;
                
                this.currentStation = { name: s.name, url: s.url_resolved, thumb: thumb };
                
                // Update UI
                this.playerName.textContent = s.name;
                this.playerThumb.src = thumb;
                this.playerBgBlur.style.backgroundImage = `url('${thumb}')`;
                
                // Prepare Audio
                this.audio.src = s.url_resolved;
                this.audio.load();
                
                this.setupMediaSession();
                this.startBufferingEngine();
            }

            startBufferingEngine() {
                // Delayed Playback to build OS-level socket buffer for Screen-Off resilience
                clearTimeout(this.bufferTimeout);
                this.isBuffering = true;
                this.isPlaying = false;
                this.updateVinylAnimation();
                this.updatePlayIcon();
                
                this.playerBuffering.classList.remove('hidden');
                this.playerStatus.textContent = 'Building Deep Buffer...';
                
                this.bufferTimeout = setTimeout(() => {
                    if (this.currentStation) {
                        this.executePlay();
                    }
                }, this.bufferTargetSeconds);
            }

            executePlay() {
                this.isBuffering = false;
                this.playerBuffering.classList.add('hidden');
                this.playerStatus.textContent = 'Playing';
                
                const playPromise = this.audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        this.isPlaying = true;
                        this.updateVinylAnimation();
                        this.updatePlayIcon();
                    }).catch(err => {
                        console.warn("Autoplay prevented or network issue:", err);
                        this.isPlaying = false;
                        this.playerStatus.textContent = 'Tap Play to Start';
                        this.updateVinylAnimation();
                        this.updatePlayIcon();
                    });
                }
            }

            togglePlay() {
                if (!this.currentStation) {
                    this.playRandom();
                    return;
                }

                if (this.isPlaying) {
                    this.isPlaying = false;
                    this.audio.pause();
                    this.playerStatus.textContent = 'Paused';
                } else {
                    // If resuming, just play immediately without deep buffer wait
                    this.isPlaying = true;
                    this.playerStatus.textContent = 'Playing';
                    this.audio.play().catch(e => {
                        this.isPlaying = false;
                        this.playerStatus.textContent = 'Playback Error';
                    });
                }
                
                this.updateVinylAnimation();
                this.updatePlayIcon();
            }

            updateVinylAnimation() {
                if (this.isPlaying) {
                    this.playerStage.classList.remove('is-paused');
                    this.playerStage.classList.add('is-playing');
                } else if (this.isBuffering || this.audio.paused) {
                    this.playerStage.classList.remove('is-playing');
                    this.playerStage.classList.add('is-paused');
                }
            }

            updatePlayIcon() {
                if (this.isBuffering) {
                    this.iconPlay.className = "fa-solid fa-hourglass-half text-2xl sm:text-3xl ml-0";
                } else if (this.isPlaying) {
                    this.iconPlay.className = "fa-solid fa-pause text-3xl sm:text-4xl ml-0";
                } else {
                    this.iconPlay.className = "fa-solid fa-play text-3xl sm:text-4xl ml-2";
                }
            }

            setupAudioListeners() {
                this.audio.addEventListener('error', () => {
                    this.playerStatus.textContent = 'Stream Offline / Error';
                    this.isPlaying = false;
                    this.isBuffering = false;
                    this.playerBuffering.classList.add('hidden');
                    this.updateVinylAnimation();
                    this.updatePlayIcon();
                });
                
                this.audio.addEventListener('waiting', () => {
                    // Re-buffer if stream starves
                    if (this.isPlaying) {
                        this.playerStatus.textContent = 'Re-buffering...';
                        this.playerBuffering.classList.remove('hidden');
                        this.playerStage.classList.replace('is-playing', 'is-paused');
                    }
                });

                this.audio.addEventListener('playing', () => {
                    this.playerBuffering.classList.add('hidden');
                    this.playerStatus.textContent = 'Playing';
                    this.isPlaying = true;
                    this.updateVinylAnimation();
                    this.updatePlayIcon();
                });
            }

            setupMediaSession() {
                if ('mediaSession' in navigator && this.currentStation) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: this.currentStation.name,
                        artist: 'RelayBox FM',
                        album: 'Live Radio',
                        artwork: [ { src: this.currentStation.thumb, sizes: '300x300', type: 'image/png' } ]
                    });

                    navigator.mediaSession.setActionHandler('play', () => this.togglePlay());
                    navigator.mediaSession.setActionHandler('pause', () => this.togglePlay());
                    navigator.mediaSession.setActionHandler('nexttrack', () => this.playRandom());
                }
            }
        }

        // Boot
        window.addEventListener('DOMContentLoaded', () => {
            setupPWA();
            window.app = new RelayBoxApp();
        });

    </script>
</body>
</html>
