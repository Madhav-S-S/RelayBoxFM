<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RelayBox FM</title>
    <meta name="theme-color" content="#0f0c29">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0c29; --bg-mid: #302b63; --bg-light: #24243e;
            --accent: #ff007f; /* YouTube Music Pink */
            --accent-glow: rgba(255, 0, 127, 0.4);
            --text-main: #ffffff; --text-muted: #a099b0;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --nav-height: 65px;
            --mini-height: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid), var(--bg-light));
            background-attachment: fixed; color: var(--text-main);
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        header { padding: 15px; text-align: center; background: rgba(15, 12, 41, 0.8); backdrop-filter: blur(10px); z-index: 10; }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; }
        .author { font-size: 11px; font-weight: 300; opacity: 0.7; color: var(--accent); }

        .views-container { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--nav-height) + var(--mini-height) + 20px); }
        .view-pane { position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; opacity: 0; pointer-events: none; padding: 15px; transition: opacity 0.3s; }
        .view-pane.active { opacity: 1; pointer-events: auto; }

        .search-bar {
            width: 100%; padding: 15px 20px; border-radius: 25px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border); color: white; font-family: 'Outfit'; margin-bottom: 20px; font-size: 1rem;
        }
        .search-bar:focus { outline: none; border-color: var(--accent); }
        
        .station-list { display: flex; flex-direction: column; gap: 10px; }
        .station-card {
            display: flex; align-items: center; padding: 12px; background: var(--glass); border-radius: 15px;
            border: 1px solid var(--glass-border); transition: background 0.2s;
        }
        .station-card:active { background: rgba(255,255,255,0.1); }
        .st-img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .st-info { flex: 1; overflow: hidden; }
        .st-name { font-weight: 600; font-size: 1.05rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .st-tags { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .btn-star { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; padding: 10px; }
        .btn-star.active { color: #ffeb3b; text-shadow: 0 0 10px rgba(255,235,59,0.5); }

        /* YouTube Music Style Mini Player */
        .mini-player {
            position: fixed; bottom: var(--nav-height); left: 0; width: 100%; height: var(--mini-height);
            background: #212121; display: flex; align-items: center; padding: 0 15px;
            transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.3, 1, 0.3, 1);
            z-index: 40; cursor: pointer; border-bottom: 1px solid #333;
        }
        .mini-player.visible { transform: translateY(0); }
        .mini-img { width: 40px; height: 40px; border-radius: 4px; margin-right: 15px; object-fit: cover; }
        .mini-info { flex: 1; overflow: hidden; }
        .mini-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .mini-sub { font-size: 0.8rem; color: var(--text-muted); }
        .btn-mini-play { background: none; border: none; color: white; font-size: 1.4rem; padding: 10px; }
        
        /* Thin Snackbar */
        .mini-progress-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.1); }
        .mini-progress-grey { position: absolute; top: 0; left: 0; height: 100%; background: #888; width: 0%; transition: width 0.3s; }
        .mini-progress-pink { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }

        /* Maximized Full Screen Player */
        .max-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.98); backdrop-filter: blur(25px);
            z-index: 50; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.3, 1, 0.3, 1);
        }
        .max-player.open { transform: translateY(0); }
        
        .max-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .btn-down { background: none; border: none; color: white; font-size: 1.5rem; padding: 10px; }
        .max-header-title { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .max-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .artwork-container {
            width: 280px; height: 280px; border-radius: 50%; background: var(--glass);
            border: 2px solid var(--glass-border); margin-bottom: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .artwork-container img { width: 100%; height: 100%; object-fit: cover; }
        .spin { animation: spin 10s linear infinite; }
        .spin.paused { animation-play-state: paused; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .max-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 5px; text-align: center; line-height: 1.2; }
        .max-sub { font-size: 1rem; color: var(--text-muted); margin-bottom: 30px; }

        /* Thick Snackbar for Max Player */
        .progress-container { width: 85%; max-width: 400px; margin-bottom: 40px; }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; position: relative; overflow: hidden; }
        .progress-bar-grey { position: absolute; top: 0; left: 0; height: 100%; background: #888; width: 0%; border-radius: 3px; transition: width 0.3s; }
        .progress-bar-pink { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); width: 0%; border-radius: 3px; transition: width 0.1s; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; font-variant-numeric: tabular-nums; }

        .max-controls { display: flex; align-items: center; gap: 40px; margin-bottom: 30px; }
        .btn-play-large {
            width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: white;
            border: none; font-size: 2rem; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 25px var(--accent-glow); transition: transform 0.2s;
        }
        .btn-play-large:active { transform: scale(0.9); }

        .settings-row { display: flex; gap: 15px; }
        .setting-btn {
            background: var(--glass); border: 1px solid var(--glass-border); color: white;
            padding: 10px 20px; border-radius: 20px; font-family: 'Outfit'; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; transition: background 0.3s;
        }
        .setting-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background: rgba(10, 5, 20, 0.95); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center; z-index: 30;
        }
        .nav-item {
            color: var(--text-muted); font-size: 1.3rem; padding: 10px 30px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.3s;
        }
        .nav-item.active { color: white; }
        .nav-label { font-size: 0.7rem; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="logo">RelayBox FM <span class="author">by Madhav</span></div>
    </header>

    <div class="views-container">
        <div class="view-pane active" id="view-explore">
            <input type="text" class="search-bar" id="search-input" placeholder="Search Malayalam stations...">
            <div class="station-list" id="explore-list"></div>
        </div>
        <div class="view-pane" id="view-stars">
            <h3 style="margin-bottom: 15px;">Your Favorites</h3>
            <div class="station-list" id="stars-list"></div>
        </div>
    </div>

    <!-- Mini Player (YT Music Style) -->
    <div class="mini-player" id="mini-player" onclick="togglePlayerMax()">
        <img class="mini-img" id="mini-img" src="" alt="Art">
        <div class="mini-info">
            <div class="mini-title" id="mini-title">Station Name</div>
            <div class="mini-sub" id="mini-sub">Ready</div>
        </div>
        <button class="btn-mini-play" id="btn-play-mini" onclick="event.stopPropagation(); togglePlay();">
            <i class="fas fa-play"></i>
        </button>
        <div class="mini-progress-bg">
            <div class="mini-progress-grey" id="mini-grey"></div>
            <div class="mini-progress-pink" id="mini-pink"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('explore')" id="nav-explore">
            <i class="fas fa-compass"></i><span class="nav-label">Explore</span>
        </div>
        <div class="nav-item" onclick="switchTab('stars')" id="nav-stars">
            <i class="fas fa-star"></i><span class="nav-label">Stars</span>
        </div>
    </div>

    <!-- Maximized Player -->
    <div class="max-player" id="max-player">
        <div class="max-header">
            <button class="btn-down" onclick="togglePlayerMax()"><i class="fas fa-chevron-down"></i></button>
            <div class="max-header-title">Now Playing from Explore</div>
            <button class="btn-star" id="btn-star-max"><i class="far fa-star"></i></button>
        </div>

        <div class="max-content">
            <div class="artwork-container">
                <img id="max-artwork" src="" class="spin paused" alt="Art">
            </div>
            
            <div class="max-title" id="max-title">Station Title</div>
            <div class="max-sub" id="max-sub">Ready to play</div>

            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-grey" id="max-grey"></div>
                    <div class="progress-bar-pink" id="max-pink"></div>
                </div>
                <div class="progress-labels">
                    <span id="time-played">0:00</span>
                    <span id="time-buffered">0s Cache</span>
                </div>
            </div>

            <div class="max-controls">
                <button class="btn-play-large" id="btn-play-max" onclick="togglePlay()">
                    <i class="fas fa-play"></i>
                </button>
            </div>

            <div class="settings-row">
                <button class="setting-btn active" id="btn-toggle-buffer" onclick="toggleBufferMode()">
                    <i class="fas fa-shield-alt"></i> Buffer ON
                </button>
                <select class="setting-btn" id="sleep-timer-select">
                    <option value="0">Timer OFF</option>
                    <option value="15">15 Mins</option>
                    <option value="30">30 Mins</option>
                </select>
            </div>
        </div>
    </div>

    <!-- NATIVE AUDIO ENGINES -->
    <audio id="real-audio" crossorigin="anonymous"></audio>
    <!-- Silent CPU Wake Lock to bypass Doze -->
    <audio id="wakelock" loop src="data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU5LjI3LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIAD+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v7+/v7+"></audio>

    <script>
        let stations = [], favorites = JSON.parse(localStorage.getItem('favs')) || [];
        let currentStation = null;
        let useAggressiveBuffer = true;
        let isHoardingWait = false;
        let hoardingCheckInterval = null;
        
        const audio = document.getElementById('real-audio');
        const wakelock = document.getElementById('wakelock');

        // Network Keep-Alive Ping (Prevents Wi-Fi Sleep)
        setInterval(() => {
            if(!audio.paused) fetch('https://www.google.com/favicon.ico?' + Date.now(), { mode: 'no-cors' }).catch(()=>{});
        }, 15000);

        // --- Visual UI Progress Engine (YouTube Style) ---
        setInterval(() => {
            if (audio.readyState === 0) return;
            
            let bufferLead = 0;
            if (audio.buffered.length > 0) {
                // Calculate how many seconds of audio Android has natively downloaded ahead of our current playback
                bufferLead = audio.buffered.end(audio.buffered.length - 1) - audio.currentTime;
            }
            
            // Map the hardware cache visually. Android usually caps live buffers around 10-15s.
            let greyPercent = Math.min(100, (bufferLead / 10) * 100); 
            let pinkPercent = 90; // For live radio, playhead is fixed near the right edge
            
            if (bufferLead > 0.5) {
                document.getElementById('max-pink').style.width = pinkPercent + '%';
                document.getElementById('mini-pink').style.width = pinkPercent + '%';
                
                // Grey cache wraps slightly ahead of the pink live-head
                document.getElementById('max-grey').style.width = (pinkPercent + (greyPercent * 0.1)) + '%';
                document.getElementById('mini-grey').style.width = (pinkPercent + (greyPercent * 0.1)) + '%';
            } else {
                document.getElementById('max-pink').style.width = '0%';
                document.getElementById('max-grey').style.width = '0%';
                document.getElementById('mini-pink').style.width = '0%';
                document.getElementById('mini-grey').style.width = '0%';
            }

            document.getElementById('time-buffered').textContent = Math.floor(bufferLead) + "s Cached";
            document.getElementById('time-played').textContent = formatTime(audio.currentTime);
        }, 500);

        function formatTime(s) {
            if (isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            const r = Math.floor(s % 60);
            return `${m}:${r < 10 ? '0' : ''}${r}`;
        }

        // --- Playback Engine (Delayed Native Buffer) ---
        function playStation(uuid) {
            currentStation = stations.find(s => s.stationuuid === uuid);
            if(!currentStation) return;

            const art = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentStation.name.substring(0,2))}&background=24243e&color=ff007f&size=300`;
            document.getElementById('mini-img').src = art;
            document.getElementById('max-artwork').src = art;
            document.getElementById('mini-title').textContent = currentStation.name;
            document.getElementById('max-title').textContent = currentStation.name;
            document.getElementById('mini-player').classList.add('visible');
            updateStarBtn();

            clearInterval(hoardingCheckInterval);
            audio.src = currentStation.url_resolved;
            wakelock.play().catch(()=>{}); // Engage Doze Bypass immediately

            if (useAggressiveBuffer) {
                // START MUTED TO HOARD AUDIO
                audio.muted = true;
                isHoardingWait = true;
                updateStatus("Allocating Hardware Cache...");
                audio.play();

                hoardingCheckInterval = setInterval(() => {
                    if (audio.buffered.length > 0) {
                        const bufferSize = audio.buffered.end(audio.buffered.length - 1) - audio.currentTime;
                        if (bufferSize >= 5) { // Once Chrome has packed 5+ seconds natively
                            clearInterval(hoardingCheckInterval);
                            audio.muted = false; // Restore volume
                            isHoardingWait = false;
                            updateStatus("Playing from Buffer");
                        } else {
                            updateStatus(`Caching... ${Math.floor(bufferSize)}s / 5s`);
                        }
                    }
                }, 500);
            } else {
                audio.muted = false;
                isHoardingWait = false;
                updateStatus("Playing Live");
                audio.play();
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: currentStation.name, artist: 'RelayBox FM' });
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function togglePlay() {
            if(!currentStation) return;
            if (audio.paused) {
                audio.play();
                wakelock.play();
            } else {
                audio.pause();
                wakelock.pause();
            }
        }

        audio.addEventListener('playing', () => {
            document.getElementById('btn-play-mini').innerHTML = '<i class="fas fa-pause"></i>';
            document.getElementById('btn-play-max').innerHTML = '<i class="fas fa-pause"></i>';
            document.querySelector('.spin').classList.remove('paused');
            if (!isHoardingWait) updateStatus(useAggressiveBuffer ? "Playing from Buffer" : "Playing Live");
        });

        audio.addEventListener('pause', () => {
            document.getElementById('btn-play-mini').innerHTML = '<i class="fas fa-play"></i>';
            document.getElementById('btn-play-max').innerHTML = '<i class="fas fa-play"></i>';
            document.querySelector('.spin').classList.add('paused');
            updateStatus("Paused");
        });
        
        audio.addEventListener('waiting', () => {
            updateStatus("Recovering Stream...");
        });

        function updateStatus(text) {
            document.getElementById('mini-sub').textContent = text;
            document.getElementById('max-sub').textContent = text;
        }

        // --- Interactions & UI ---
        function togglePlayerMax() { document.getElementById('max-player').classList.toggle('open'); }

        function switchTab(tab) {
            document.querySelectorAll('.view-pane, .nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
        }

        function toggleBufferMode() {
            useAggressiveBuffer = !useAggressiveBuffer;
            const btn = document.getElementById('btn-toggle-buffer');
            if (useAggressiveBuffer) {
                btn.classList.add('active'); btn.innerHTML = '<i class="fas fa-shield-alt"></i> Buffer ON';
            } else {
                btn.classList.remove('active'); btn.innerHTML = '<i class="fas fa-stream"></i> Buffer OFF';
            }
            if (currentStation) playStation(currentStation.stationuuid);
        }

        // --- Data & Rendering ---
        async function fetchStations() {
            const list = document.getElementById('explore-list');
            try {
                const res = await fetch("https://de1.api.radio-browser.info/json/stations/search?language=malayalam&hidebroken=true&order=clickcount&reverse=true&limit=150");
                stations = await res.json();
                renderCards(stations, list);
                renderStars();
            } catch(e) { list.innerHTML = "<p>Failed to load stations.</p>"; }
        }

        function renderCards(data, container) {
            container.innerHTML = '';
            data.forEach(st => {
                const isFav = favorites.includes(st.stationuuid);
                const art = `https://ui-avatars.com/api/?name=${encodeURIComponent(st.name.substring(0,2))}&background=24243e&color=fff`;
                const card = document.createElement('div');
                card.className = 'station-card';
                card.innerHTML = `
                    <img src="${art}" class="st-img">
                    <div class="st-info" onclick='playStation("${st.stationuuid}")'>
                        <div class="st-name">${st.name}</div>
                        <div class="st-tags">${st.tags.split(',').slice(0,2).join(' • ')}</div>
                    </div>
                    <button class="btn-star ${isFav ? 'active' : ''}" onclick='toggleFav("${st.stationuuid}", this)'><i class="fas fa-star"></i></button>
                `;
                container.appendChild(card);
            });
        }

        function toggleFav(uuid, btn) {
            if (favorites.includes(uuid)) {
                favorites = favorites.filter(id => id !== uuid);
                if(btn) btn.classList.remove('active');
            } else {
                favorites.push(uuid);
                if(btn) btn.classList.add('active');
            }
            localStorage.setItem('favs', JSON.stringify(favorites));
            renderStars();
            updateStarBtn();
        }

        function renderStars() {
            const container = document.getElementById('stars-list');
            const favData = stations.filter(s => favorites.includes(s.stationuuid));
            if(favData.length===0) container.innerHTML = '<p style="color:var(--text-muted);">No favorites yet.</p>';
            else renderCards(favData, container);
        }

        function updateStarBtn() {
            const btn = document.getElementById('btn-star-max');
            if(!currentStation) return;
            btn.className = 'btn-star ' + (favorites.includes(currentStation.stationuuid) ? 'active' : '');
            btn.onclick = () => toggleFav(currentStation.stationuuid, btn);
        }

        document.getElementById('search-input').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            renderCards(stations.filter(s => s.name.toLowerCase().includes(q)), document.getElementById('explore-list'));
        });

        // Sleep timer
        document.getElementById('sleep-timer-select').addEventListener('change', e => {
            const mins = parseInt(e.target.value);
            if (mins > 0) setTimeout(() => { audio.pause(); wakelock.pause(); }, mins * 60000);
        });

        fetchStations();
    </script>
</body>
</html>
