<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RelayBox FM</title>
    <meta name="theme-color" content="#1a0b2e">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1a0b2e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff007f;
            --text-main: #ffffff;
            --text-muted: #a099b0;
            --nav-height: 65px;
            --mini-player-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #4b1d52);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { font-size: 0.8rem; font-weight: 300; color: var(--accent); vertical-align: middle; margin-left: 5px; }

        /* Tab System */
        .tab-content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: calc(var(--nav-height) + var(--mini-player-height) + 20px);
        }
        .tab-pane {
            position: absolute;
            top: 0; left: 0; width: 100%; min-height: 100%;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0.98);
            padding: 20px;
        }
        .tab-pane.active { opacity: 1; pointer-events: auto; transform: scale(1); }

        /* Main Player Tab */
        .player-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .artwork-container {
            width: 250px; height: 250px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .artwork-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .spin { animation: spin 10s linear infinite; }
        .spin.paused { animation-play-state: paused; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .station-title { font-size: 1.8rem; font-weight: 600; margin-bottom: 10px; }
        .now-playing-text { font-size: 1rem; color: var(--text-muted); min-height: 24px; margin-bottom: 30px; }

        .controls { display: flex; align-items: center; gap: 30px; margin-bottom: 40px; }
        .btn-circle {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--accent); color: white;
            border: none; font-size: 1.5rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(255,0,127,0.4);
            cursor: pointer; transition: transform 0.2s;
        }
        .btn-circle:active { transform: scale(0.9); }
        .btn-icon { background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }
        .btn-icon.active { color: var(--accent); }

        /* Buffer & Sleep Timer Settings */
        .settings-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 20px; width: 100%; max-width: 350px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; }
        .toggle-switch {
            position: relative; display: inline-block; width: 50px; height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }
        select {
            background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--glass-border);
            padding: 8px; border-radius: 8px; outline: none; font-family: 'Outfit';
        }

        /* Lists (Explore & Stars) */
        .search-bar {
            width: 100%; padding: 15px; border-radius: 25px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; font-family: 'Outfit'; margin-bottom: 20px; font-size: 1rem;
        }
        .station-list { display: flex; flex-direction: column; gap: 10px; }
        .station-card {
            display: flex; align-items: center; padding: 15px;
            background: var(--glass-bg); border-radius: 15px;
            border: 1px solid var(--glass-border);
            transition: background 0.2s;
        }
        .station-card:active { background: rgba(255,255,255,0.1); }
        .st-img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .st-info { flex: 1; overflow: hidden; }
        .st-name { font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .st-tags { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
        .st-actions { display: flex; gap: 15px; align-items: center; }

        /* Mini Player */
        .mini-player {
            position: fixed; bottom: var(--nav-height); left: 0; width: 100%;
            height: var(--mini-player-height);
            background: rgba(10, 5, 20, 0.85); backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            display: flex; align-items: center; padding: 0 20px;
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20; cursor: pointer;
        }
        .mini-player.visible { transform: translateY(0); }
        .mini-img { width: 45px; height: 45px; border-radius: 50%; margin-right: 15px; }
        .mini-info { flex: 1; overflow: hidden; }
        .mini-title { font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .mini-sub { font-size: 0.8rem; color: var(--text-muted); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background: rgba(0,0,0,0.5); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--glass-border); z-index: 30;
        }
        .nav-item {
            color: var(--text-muted); font-size: 1.5rem; padding: 10px 20px;
            cursor: pointer; transition: color 0.3s, transform 0.2s;
        }
        .nav-item.active { color: var(--accent); transform: scale(1.1); }

        /* Loader */
        .loader {
            display: none; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent); border-radius: 50%;
            width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RelayBox FM <span>by Madhav</span></div>
    </header>

    <div class="tab-content" id="main-content">
        <!-- Player Tab -->
        <div class="tab-pane active" id="tab-music">
            <div class="player-wrapper">
                <div class="artwork-container">
                    <img id="main-artwork" src="https://ui-avatars.com/api/?name=R&background=random&size=250" alt="Artwork" class="spin paused">
                </div>
                <div class="station-title" id="main-title">Select a Station</div>
                <div class="now-playing-text" id="main-sub">Ready to play</div>
                
                <div class="controls">
                    <button class="btn-icon" id="btn-star-main"><i class="far fa-star"></i></button>
                    <button class="btn-circle" id="btn-play-main">
                        <i class="fas fa-play" id="play-icon-main"></i>
                        <div class="loader" id="main-loader"></div>
                    </button>
                    <button class="btn-icon" onclick="playRandomStation()"><i class="fas fa-random"></i></button>
                </div>

                <div class="settings-card">
                    <div class="setting-row">
                        <div>
                            <strong>Aggressive Buffer</strong><br>
                            <small style="color: var(--text-muted)">Prevents Doze pauses (delayed start)</small>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggle-buffer">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-row">
                        <strong>Sleep Timer</strong>
                        <select id="sleep-timer-select">
                            <option value="0">Off</option>
                            <option value="15">15 Mins</option>
                            <option value="30">30 Mins</option>
                            <option value="60">1 Hour</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stars / Favorites Tab -->
        <div class="tab-pane" id="tab-stars">
            <h2 style="margin-bottom: 20px;">Your Favorites</h2>
            <div class="station-list" id="stars-list"></div>
        </div>

        <!-- Explore / Search Tab -->
        <div class="tab-pane" id="tab-search">
            <input type="text" class="search-bar" id="search-input" placeholder="Search Malayalam stations...">
            <div class="station-list" id="explore-list"></div>
        </div>
    </div>

    <!-- Mini Player -->
    <div class="mini-player" id="mini-player" onclick="switchTab('music')">
        <img class="mini-img spin paused" id="mini-artwork" src="https://ui-avatars.com/api/?name=R&background=random" alt="Artwork">
        <div class="mini-info">
            <div class="mini-title" id="mini-title">Not Playing</div>
            <div class="mini-sub" id="mini-sub">Tap to open</div>
        </div>
        <button class="btn-icon" id="btn-play-mini" onclick="event.stopPropagation(); togglePlay();">
            <i class="fas fa-play" id="play-icon-mini"></i>
        </button>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('music')" id="nav-music"><i class="fas fa-music"></i></div>
        <div class="nav-item" onclick="switchTab('stars')" id="nav-stars"><i class="fas fa-star"></i></div>
        <div class="nav-item" onclick="switchTab('search')" id="nav-search"><i class="fas fa-search"></i></div>
    </div>

    <script>
        // --- Core State ---
        let stations = [];
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let currentStation = null;
        let isPlaying = false;
        let isBufferingMode = false;
        let sleepTimerId = null;

        const audio = new Audio();
        audio.crossOrigin = "anonymous";

        // --- Service Worker Generator for Aggressive Buffering ---
        // We dynamically inject a Service Worker to intercept stream requests and buffer them into memory.
        const swScript = `
            self.addEventListener('install', () => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            
            self.addEventListener('fetch', event => {
                const url = new URL(event.request.url);
                if (url.pathname === '/relaybox-buffer') {
                    const targetStream = url.searchParams.get('stream');
                    event.respondWith(handleBufferedStream(targetStream));
                }
            });

            async function handleBufferedStream(targetUrl) {
                try {
                    const response = await fetch(targetUrl);
                    const reader = response.body.getReader();
                    const buffer = [];
                    let bytesLoaded = 0;
                    
                    // Aggressively download ~1MB (approx 1 min of audio) before yielding to player
                    while (bytesLoaded < 1000000) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        buffer.push(value);
                        bytesLoaded += value.length;
                    }

                    const stream = new ReadableStream({
                        async start(controller) {
                            // Push the pre-loaded buffer instantly
                            buffer.forEach(chunk => controller.enqueue(chunk));
                            // Continue fetching seamlessly
                            while(true) {
                                const {done, value} = await reader.read();
                                if(done) break;
                                controller.enqueue(value);
                            }
                            controller.close();
                        }
                    });

                    return new Response(stream, {
                        headers: { 'Content-Type': response.headers.get('Content-Type') || 'audio/mpeg' }
                    });
                } catch (e) {
                    return fetch(targetUrl); // Fallback to direct stream if proxy fails
                }
            }
        `;
        const swBlob = new Blob([swScript], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(swBlob);
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).catch(err => console.warn("SW Registration failed (requires HTTPS):", err));
        }

        // --- Data Fetching ---
        async function fetchMalayalamStations() {
            const cached = localStorage.getItem('malayalam_stations');
            if (cached) {
                stations = JSON.parse(cached);
                renderExploreList(stations);
                renderFavorites();
            }

            try {
                const res = await fetch("https://de1.api.radio-browser.info/json/stations/search?language=malayalam&hidebroken=true&order=clickcount&reverse=true&limit=200");
                const data = await res.json();
                if(data.length > 0) {
                    stations = data;
                    localStorage.setItem('malayalam_stations', JSON.stringify(stations));
                    renderExploreList(stations);
                    renderFavorites();
                }
            } catch (err) {
                console.error("Failed to update stations", err);
            }
        }

        // --- Artwork Fallback Generator ---
        function getArtwork(station) {
            if (station.favicon && station.favicon.startsWith('http')) return station.favicon;
            const fallbackName = encodeURIComponent(station.name.substring(0, 2));
            return `https://ui-avatars.com/api/?name=${fallbackName}&background=random&color=fff&size=250`;
        }

        // --- UI Rendering ---
        function renderExploreList(data) {
            const list = document.getElementById('explore-list');
            list.innerHTML = '';
            data.forEach(station => list.appendChild(createStationCard(station)));
        }

        function renderFavorites() {
            const list = document.getElementById('stars-list');
            list.innerHTML = '';
            const favStations = stations.filter(s => favorites.includes(s.stationuuid));
            if(favStations.length === 0) list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No favorites yet. Star some in Explore!</p>';
            favStations.forEach(station => list.appendChild(createStationCard(station)));
        }

        function createStationCard(station) {
            const isFav = favorites.includes(station.stationuuid);
            const card = document.createElement('div');
            card.className = 'station-card';
            card.innerHTML = `
                <img src="${getArtwork(station)}" class="st-img" onerror="this.src='https://ui-avatars.com/api/?name=FM&background=random'">
                <div class="st-info" onclick='playStationById("${station.stationuuid}")'>
                    <div class="st-name">${station.name}</div>
                    <div class="st-tags">${station.tags.split(',').slice(0,3).join(' • ')}</div>
                </div>
                <div class="st-actions">
                    <button class="btn-icon ${isFav ? 'active' : ''}" onclick='toggleFavorite("${station.stationuuid}", this)'>
                        <i class="${isFav ? 'fas' : 'far'} fa-star"></i>
                    </button>
                </div>
            `;
            return card;
        }

        // --- Tab Management ---
        let currentTab = 'music';
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            currentTab = tabId;

            const miniPlayer = document.getElementById('mini-player');
            if (tabId === 'music' || !currentStation) {
                miniPlayer.classList.remove('visible');
            } else {
                miniPlayer.classList.add('visible');
            }
        }

        // --- Player Logic ---
        function playStationById(uuid) {
            const station = stations.find(s => s.stationuuid === uuid);
            if(station) loadAndPlayStation(station);
        }

        function playRandomStation() {
            if(stations.length === 0) return;
            const random = stations[Math.floor(Math.random() * stations.length)];
            loadAndPlayStation(random);
        }

        function loadAndPlayStation(station) {
            currentStation = station;
            
            // Update UI
            const art = getArtwork(station);
            document.getElementById('main-artwork').src = art;
            document.getElementById('mini-artwork').src = art;
            document.getElementById('main-title').textContent = station.name;
            document.getElementById('mini-title').textContent = station.name;
            document.getElementById('main-sub').textContent = "Connecting...";
            document.getElementById('mini-sub').textContent = "Connecting...";
            
            updateMainStarButton();

            // Set Audio Source based on Buffer Setting
            isBufferingMode = document.getElementById('toggle-buffer').checked;
            
            if (isBufferingMode && navigator.serviceWorker.controller) {
                // Route through the aggressive caching Service Worker
                audio.src = `/relaybox-buffer?stream=${encodeURIComponent(station.url_resolved)}`;
                document.getElementById('main-sub').textContent = "Building Buffer (Takes ~10s)...";
            } else {
                // Direct stream
                audio.src = station.url_resolved;
            }

            audio.play().catch(e => {
                console.error("Playback failed", e);
                document.getElementById('main-sub').textContent = "Error playing station";
            });

            // Set Media Session for Lock Screen
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: station.name,
                    artist: 'RelayBox FM (by Madhav)',
                    album: 'Live Radio',
                    artwork: [{ src: art, sizes: '256x256', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function togglePlay() {
            if(!currentStation) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        // --- Audio Events ---
        audio.addEventListener('play', () => {
            document.getElementById('play-icon-main').style.display = 'none';
            document.getElementById('main-loader').style.display = 'block';
        });

        audio.addEventListener('playing', () => {
            isPlaying = true;
            document.getElementById('play-icon-main').className = 'fas fa-pause';
            document.getElementById('play-icon-mini').className = 'fas fa-pause';
            document.getElementById('play-icon-main').style.display = 'block';
            document.getElementById('main-loader').style.display = 'none';
            
            document.querySelectorAll('.spin').forEach(el => el.classList.remove('paused'));
            document.getElementById('main-sub').textContent = isBufferingMode ? "Playing from Buffer" : "Playing Live";
            document.getElementById('mini-sub').textContent = "Now Playing";
        });

        audio.addEventListener('pause', () => {
            isPlaying = false;
            document.getElementById('play-icon-main').className = 'fas fa-play';
            document.getElementById('play-icon-mini').className = 'fas fa-play';
            document.getElementById('play-icon-main').style.display = 'block';
            document.getElementById('main-loader').style.display = 'none';
            
            document.querySelectorAll('.spin').forEach(el => el.classList.add('paused'));
            document.getElementById('main-sub').textContent = "Paused";
            document.getElementById('mini-sub').textContent = "Paused";
        });

        document.getElementById('btn-play-main').addEventListener('click', togglePlay);

        // --- Favorites Management ---
        function toggleFavorite(uuid, btnElement) {
            if (favorites.includes(uuid)) {
                favorites = favorites.filter(id => id !== uuid);
                if(btnElement) btnElement.classList.remove('active');
                if(btnElement) btnElement.innerHTML = '<i class="far fa-star"></i>';
            } else {
                favorites.push(uuid);
                if(btnElement) btnElement.classList.add('active');
                if(btnElement) btnElement.innerHTML = '<i class="fas fa-star"></i>';
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderFavorites();
            if(currentStation && currentStation.stationuuid === uuid) updateMainStarButton();
        }

        function updateMainStarButton() {
            const btn = document.getElementById('btn-star-main');
            if(!currentStation) return;
            if(favorites.includes(currentStation.stationuuid)) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-star"></i>';
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="far fa-star"></i>';
            }
            btn.onclick = () => toggleFavorite(currentStation.stationuuid);
        }

        // --- Search functionality ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = stations.filter(s => s.name.toLowerCase().includes(query) || s.tags.toLowerCase().includes(query));
            renderExploreList(filtered);
        });

        // --- Sleep Timer ---
        document.getElementById('sleep-timer-select').addEventListener('change', (e) => {
            clearTimeout(sleepTimerId);
            const minutes = parseInt(e.target.value);
            if (minutes > 0) {
                sleepTimerId = setTimeout(() => {
                    audio.pause();
                    document.getElementById('sleep-timer-select').value = "0";
                    if ('vibrate' in navigator) navigator.vibrate(500);
                }, minutes * 60000);
            }
        });

        // Initialize
        fetchMalayalamStations();
    </script>
</body>
</html>
